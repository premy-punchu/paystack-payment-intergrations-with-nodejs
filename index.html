<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paystack Inline Checkout</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Load Paystack Standard Inline Script -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Payment Card -->
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-900 mb-6 text-center">Checkout</h1>
        
        <div class="space-y-4 mb-8">
            <div class="flex justify-between items-center p-4 bg-blue-50 rounded-lg">
                <span class="text-gray-700 font-semibold">Item:</span>
                <span class="text-blue-600 font-bold">Premium Service Access</span>
            </div>
            <div class="flex justify-between items-center p-4 bg-green-50 rounded-lg">
                <span class="text-gray-700 font-semibold">Amount:</span>
                <span class="text-green-600 font-bold text-2xl">₦5,000.00</span>
            </div>
        </div>

        <p class="text-sm text-gray-600 mb-6 text-center">
            Click the button below to initiate the payment via the Paystack inline modal.
        </p>
        
        <button id="payButton" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-300 transform hover:scale-[1.01] shadow-lg shadow-indigo-500/50 focus:outline-none focus:ring-4 focus:ring-indigo-500/50">
            Pay Now
        </button>

        <!-- Message Box for Feedback (Replaces alert()) -->
        <div id="messageBox" class="mt-6 p-4 rounded-lg bg-gray-200 text-gray-800 text-sm hidden"></div>
    </div>

    <script>
        // NOTE: In a real application, the PUBLIC_KEY and transaction details 
        // would be dynamically loaded from your Node.js backend endpoint after calling initializeTransaction.

        // --- Paystack Configuration (Frontend) ---
        // PUBLIC KEY is now set to your provided test key.
        const PUBLIC_KEY = 'pk_test_305e7f817466c71bcd83f27d3a299ba11cafbe1d'; 
        
        const config = {
            key: PUBLIC_KEY, 
            email: "testuser@example.com", // This would typically come from the logged-in user
            amount: 500000, // 5000 NGN in Kobo
            ref: 'PAYSTACK_REF_' + Date.now(), // This must match the reference generated by the backend
            currency: 'NGN', 
            
            // --- Handlers ---
            callback: function(response){
                // This function is called after a successful transaction attempt on the Paystack popup
                const ref = response.reference;
                showMessage(`Payment Complete! Reference: ${ref}. 
                \nACTION: Send this reference back to your server (backend) for secure verification.`, 'bg-green-100 text-green-800');
                console.log('Client-side callback received, status:', response.status);
                
                // CRITICAL NEXT STEP: In a real app, you would make an AJAX call or redirect:
                // fetch('/verify-payment?reference=' + ref); // This endpoint on your server runs verifyTransaction()
            },
            
            onClose: function(){
                // This function is called if the user closes the payment modal
                showMessage('Payment modal closed. Transaction cancelled by user.', 'bg-yellow-100 text-yellow-800');
            }
        };

        // --- UI Logic ---
        function showMessage(msg, style) {
            const box = document.getElementById('messageBox');
            box.textContent = msg;
            box.className = `mt-6 p-4 rounded-lg text-sm ${style} block`;
        }

        document.getElementById('payButton').addEventListener('click', () => {
            // PaystackPop.setup() initializes the payment modal
            const handler = PaystackPop.setup(config);
            handler.openIframe();
        });
    </script>
</body>
</html>
